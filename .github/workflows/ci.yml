name: CI

# Stages run in the order required for every PR; each stage blocks the next.
#   1 lint, format, type checks   2 unit tests   3 Cek Aman safety regression
#   4 contract check   5 fixture guard and reference data validation
#   6 secret and dependency scans   7 AI eval (when prompts or model config
#   change)   8 Android build
# Branch protection should require "CI passed" and
# "Cek Aman safety regression (required)".
#
# Skips propagate: a job with no `if:` runs only when every job above it in
# the dependency chain succeeded, so a legitimately skipped job (for example
# the Dart jobs while mobile CI is off) silently skips everything after it.
# Every job below its first `needs:` therefore carries an explicit `if:`, and
# "CI passed" requires each mandatory job to report success, not just
# "not failed". Stages 5 and 6 run even when an earlier stage failed, so a
# leaked secret, a fixture reference or invalid reference data is always
# reported.
#
# Mobile jobs (Dart lint, Dart tests with the generated Dart client check,
# Android build) run only when apps/mobile/pubspec.yaml exists AND the
# repository variable MOBILE_CI_ENABLED is "true", and then on every push to
# main and manual run, and on pull requests that change the "mobile" paths
# in the detect job. When they run they must succeed; when they are off they
# must be skipped. A Flutter project with the variable unset is reported as a
# warning on every run.
#
# Android only (docs/DECISIONS.md, 2026-11-10): there is no iOS job.
# Runners are pinned to ubuntu-24.04 so a change to the ubuntu-latest label
# cannot change behavior; bump deliberately.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ai_eval: ${{ steps.filter.outputs.ai_eval }}
      mobile: ${{ steps.mobile.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ai_eval:
              - "services/ai/prompts/**"
              - "services/ai/config/**"
              - "services/ai/**/model_config*"
              - "tests/ai-eval/**"
            # The app, the generated Dart API client it consumes, and the CI
            # definition that builds them.
            mobile:
              - "apps/mobile/**"
              - "packages/contracts/**"
              - ".github/workflows/ci.yml"
              - ".github/actions/**"
      # Mobile jobs run when all of these hold:
      #   - the Flutter project exists (apps/mobile/pubspec.yaml)
      #   - the repository variable MOBILE_CI_ENABLED is "true"
      #   - this is a push to main or a manual run (always), or a pull request
      #     that changes one of the "mobile" paths above
      - id: mobile
        env:
          MOBILE_CI_ENABLED: ${{ vars.MOBILE_CI_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          MOBILE_CHANGED: ${{ steps.filter.outputs.mobile }}
        run: |
          on() {
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Mobile CI on ($1): Dart lint, Dart tests, the Dart client check and the Android build must succeed."
          }
          off() {
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Mobile CI skipped: $1."
          }
          if [ ! -f apps/mobile/pubspec.yaml ]; then
            off "apps/mobile has no Flutter project"
          elif [ "$MOBILE_CI_ENABLED" != "true" ]; then
            off "MOBILE_CI_ENABLED is not \"true\""
            echo "::warning::apps/mobile/pubspec.yaml exists but the repository variable MOBILE_CI_ENABLED is not \"true\": Dart lint, Dart tests, the Dart client check and the Android build did NOT run."
          elif [ "$EVENT_NAME" != "pull_request" ]; then
            on "$EVENT_NAME runs every mobile job"
          elif [ "$MOBILE_CHANGED" = "true" ]; then
            on "the pull request changes mobile paths"
          else
            off "the pull request changes no mobile paths"
          fi

  # ---------- Stage 1: lint, format and type checks ----------
  lint-ts:
    name: "1 Lint and types (TypeScript)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  lint-python:
    name: "1 Lint and types (Python)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-ai
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  lint-dart:
    name: "1 Lint and types (Dart)"
    needs: detect
    if: needs.detect.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/mobile/pubspec.yaml
          cache: true
      # Also generates the localization code that analyze reads.
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze

  lint-infra:
    name: "1 Terraform format and validate (unvalidated skeleton)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The infra skeleton has never been validated with Terraform. Remove
    # continue-on-error after the first green run so it becomes blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate each environment
        run: |
          for env in infra/envs/*/; do
            echo "::group::$env"
            terraform -chdir="$env" init -backend=false -input=false
            terraform -chdir="$env" validate
            echo "::endgroup::"
          done

  # ---------- Stage 2: unit tests ----------
  test-ts:
    name: "2 Unit tests (TypeScript)"
    needs: [lint-ts, lint-python, lint-dart]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - run: pnpm build
      - run: pnpm test

  test-python:
    name: "2 Unit tests (Python)"
    needs: [lint-ts, lint-python, lint-dart]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-ai
      - run: python -m pytest

  test-dart:
    name: "2 Unit tests (Dart)"
    needs: [detect, lint-dart]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.mobile == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/mobile/pubspec.yaml
          cache: true
      # Also generates the localization code (flutter.generate: true).
      - run: flutter pub get
      - run: flutter test
      # Generated Dart API client (packages/contracts/generated/dart): pub get,
      # analyze and the smoke program, with the Dart SDK that Flutter provides.
      # Needs pub.dev access; writes only to a temporary directory.
      - uses: ./.github/actions/setup-node-workspace
      - name: Verify the generated Dart API client
        working-directory: .
        run: pnpm --filter @keluargamakan/contracts run verify:dart

  # ---------- Stage 3: Cek Aman safety regression (NFR-07) ----------
  safety-regression:
    name: Cek Aman safety regression (required)
    needs: [test-ts, test-python, test-dart]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      # Must pass at 100%: no retries, and a run with zero cases fails.
      - run: pnpm test:safety

  # ---------- Stage 4: contract check ----------
  contracts:
    name: "4 Contract check"
    needs: safety-regression
    # Explicit `if:` so the skipped Dart jobs upstream do not skip this job.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The OpenAPI Generator jar (Dart client) needs Java 11 or later.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-node-workspace
      # Cache key = the generator version and SHA-256 pinned in generate.mjs.
      # generate.mjs re-checks the jar's SHA-256 before every run, so a cached
      # jar that does not match is refused, never executed.
      - name: Read the pinned OpenAPI Generator version
        id: generator
        run: |
          script=packages/contracts/scripts/generate.mjs
          block="$(sed -n '/^export const OPENAPI_GENERATOR = {/,/^};/p' "$script")"
          version="$(sed -nE 's/^ *version: "([^"]+)",$/\1/p' <<<"$block")"
          sha256="$(sed -nE 's/^ *sha256: "([0-9a-f]{64})",$/\1/p' <<<"$block")"
          if [ -z "$version" ] || [ -z "$sha256" ]; then
            echo "::error file=$script::could not read OPENAPI_GENERATOR version and sha256"
            exit 1
          fi
          echo "OpenAPI Generator $version ($sha256)"
          echo "key=openapi-generator-${version}-${sha256}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/contracts/node_modules/.cache/openapi-generator
          key: ${{ steps.generator.outputs.key }}
      # Regenerates the TypeScript and Dart clients from
      # packages/contracts/openapi.yaml and fails on any drift: modified,
      # deleted or new untracked files.
      - run: pnpm check:contracts

  # ---------- Stage 5: fixture guard and reference data validation ----------
  fixture-guard:
    name: "5 Fixture guard"
    needs: contracts
    # Runs on every push and PR, even if an earlier stage failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-fixture-refs.mjs

  # SAF-06, SAF-13 (security finding H1): every file in data/reference/ must
  # pass data/schema/ and the cross-record checks before it can reach Cek Aman.
  reference-data:
    name: "5 Reference data validation (required)"
    needs: contracts
    # Runs on every push and PR, even if an earlier stage failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - run: pnpm validate:reference
      # TODO(T-014): enable once the content team's real data is in
      # data/reference/. `build:reference` fails while the folder is empty, so
      # it stays commented until then. When enabled, keep it in this job.
      # - run: pnpm build:reference

  # ---------- Stage 6: secret and dependency scans (NFR-10) ----------
  secret-scan:
    name: "6 Secret scan"
    needs: fixture-guard
    # Runs on every push and PR, even if an earlier stage failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum pinned)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      # --redact keeps any finding's value out of the CI log.
      - name: Scan full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

  dependency-scan:
    name: "6 Dependency vulnerability scan"
    needs: fixture-guard
    # Runs on every push and PR, even if an earlier stage failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - run: pnpm audit:deps
      - uses: ./.github/actions/setup-python-ai
      - name: Audit Python dependencies
        working-directory: services/ai
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/requirements-frozen.txt"
          pip-audit -r "$RUNNER_TEMP/requirements-frozen.txt" --no-deps --disable-pip --strict

  # ---------- Stage 7: AI eval (AI-10) ----------
  ai-eval:
    name: "7 AI eval"
    needs: [detect, secret-scan, dependency-scan]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.ai_eval == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-ai
      # Runs against the mock provider only; no provider credentials in CI.
      - run: python -m pytest tests/ai-eval -p no:cacheprovider

  # ---------- Stage 8: Android build (Android only, no iOS) ----------
  mobile-android:
    name: "8 Mobile build (Android)"
    needs: [detect, secret-scan, dependency-scan, ai-eval]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.mobile == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # NDK used by Flutter 3.47.9 (android/app/build.gradle.kts reads
      # flutter.ndkVersion). Bump together with the Flutter version.
      ANDROID_NDK_VERSION: 28.2.13676358
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/mobile/pubspec.yaml
          cache: true
      - name: Install Android NDK if the runner lacks it
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ]; then
            echo "::error::ANDROID_HOME is not set on this runner"
            exit 1
          fi
          ndk="$sdk/ndk/$ANDROID_NDK_VERSION"
          if [ -f "$ndk/source.properties" ]; then
            echo "NDK $ANDROID_NDK_VERSION already installed"
          else
            # `yes` answers any license prompt; `|| true` keeps its SIGPIPE
            # exit from failing the pipeline under pipefail.
            { yes 2>/dev/null || true; } \
              | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
            test -f "$ndk/source.properties"
            echo "Installed NDK $ANDROID_NDK_VERSION"
          fi
      # android/gradle.properties asks for an 8 GB Gradle heap (fine on a
      # workstation). GitHub's standard runners for private repositories have
      # about 7 GB of RAM, so CI caps it. The user-level file overrides the
      # project file; nothing in the repository changes.
      - name: Cap Gradle memory for the runner
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError" \
            >> "$HOME/.gradle/gradle.properties"
      - run: flutter pub get
      # Unsigned debug build only. Release signing and store upload are a
      # human gate.
      - run: flutter build apk --debug

  # ---------- Gate ----------
  # Mandatory jobs must report "success"; "skipped" fails the gate. Conditional
  # jobs must succeed when their detect output turns them on and must be
  # skipped when it is off: ai-eval follows detect.outputs.ai_eval and the
  # mobile jobs follow detect.outputs.mobile. lint-infra is excluded while it is
  # continue-on-error (see above).
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - detect
      - lint-ts
      - lint-python
      - lint-dart
      - test-ts
      - test-python
      - test-dart
      - safety-regression
      - contracts
      - fixture-guard
      - reference-data
      - secret-scan
      - dependency-scan
      - ai-eval
      - mobile-android
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory stage to succeed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRED: >-
            detect lint-ts lint-python test-ts test-python safety-regression
            contracts fixture-guard reference-data secret-scan dependency-scan
          MOBILE_JOBS: lint-dart test-dart mobile-android
        run: |
          set -euo pipefail
          fail=0
          expect() {
            local job="$1" want="$2" got
            got="$(jq -r --arg j "$job" '.[$j].result // "missing"' <<<"$NEEDS")"
            if [ "$got" = "$want" ]; then
              echo "ok    $job: $got"
            else
              echo "::error::$job: expected $want, got $got"
              fail=1
            fi
          }

          for job in $REQUIRED; do
            expect "$job" success
          done

          ai_eval="$(jq -r '.detect.outputs.ai_eval // ""' <<<"$NEEDS")"
          if [ "$ai_eval" = "true" ]; then
            expect ai-eval success
          else
            expect ai-eval skipped
          fi

          mobile="$(jq -r '.detect.outputs.mobile // ""' <<<"$NEEDS")"
          for job in $MOBILE_JOBS; do
            if [ "$mobile" = "true" ]; then
              expect "$job" success
            else
              expect "$job" skipped
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::CI gate failed. Cek Aman safety regression result: $(jq -r '."safety-regression".result' <<<"$NEEDS")"
            exit 1
          fi
          echo "All required stages passed."
