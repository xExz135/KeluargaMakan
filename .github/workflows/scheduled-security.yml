name: Scheduled dependency scan

# NFR-10: re-scan dependencies weekly so new advisories surface even when no
# PR is open.

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC (08:00 WIB)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - run: pnpm audit:deps
      - uses: ./.github/actions/setup-python-ai
      - name: Audit Python dependencies
        working-directory: services/ai
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/requirements-frozen.txt"
          pip-audit -r "$RUNNER_TEMP/requirements-frozen.txt" --no-deps --disable-pip --strict
