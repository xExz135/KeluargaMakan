version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: pip
    directory: /services/ai
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directory: /infra/envs/staging
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directory: /infra/envs/production
    schedule:
      interval: monthly
